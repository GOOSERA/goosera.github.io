<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Onion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --room: #1b1b1b;      /* back wall / base */
      --ceiling: #202020;
      --floor: #151515;
      --wall-left: #1d1d1d;
      --wall-right: #191919;
      --edge: #000000;      /* the perspective lines */
      --panel: #a3b2aa;     /* gray-green center panel */
      --panel-edge: #2a2f2c;
      --ink: #111111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--room);
      overflow: hidden;
    }

    /* The room: four walls drawn as polygons that meet the panel's corners */
    #room {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #room polygon { stroke: var(--edge); stroke-width: 1.5; }
    #ceiling { fill: var(--ceiling); }
    #floor   { fill: var(--floor); }
    #left    { fill: var(--wall-left); }
    #right   { fill: var(--wall-right); }

    /* The center panel (the far wall of the room) */
    .panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: max(28vw, 220px);
      aspect-ratio: 3 / 2;
      background: var(--panel);
      border: 1.5px solid var(--panel-edge);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35em;
      font-family: "Gochi Hand", "Comic Sans MS", "Segoe Print", cursive;
      font-size: clamp(1.1rem, 1.9vw, 1.8rem);
    }

    nav a {
      color: var(--ink);
      text-decoration: none;
      padding: 0.05em 0.2em;
      border-bottom: 2px solid transparent;
    }
    nav a:hover { border-bottom-color: var(--ink); }
    nav a:focus-visible {
      outline: 2px dashed var(--ink);
      outline-offset: 3px;
    }
  </style>
</head>
<body>

  <svg id="room" aria-hidden="true">
    <polygon id="ceiling" />
    <polygon id="floor" />
    <polygon id="left" />
    <polygon id="right" />
  </svg>

  <main class="panel">
    <nav aria-label="Main">
      <ul>
        <li><a href="animations.html">My animations</a></li>
        <li><a href="https://www.youtube.com/@TheOnionAnimator" target="_blank" rel="noopener">My Youtube channel</a></li>
        <li><a href="contacts.html">Contacts</a></li>
      </ul>
    </nav>
  </main>

  <script>
    // Connect each screen corner to the matching panel corner,
    // so the "room" lines stay correct at any window size.
    const panel = document.querySelector('.panel');
    const svg = document.getElementById('room');

    function drawRoom() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const r = panel.getBoundingClientRect();
      svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

      const pts = arr => arr.map(p => p.join(',')).join(' ');
      const tl = [r.left, r.top], tr = [r.right, r.top];
      const bl = [r.left, r.bottom], br = [r.right, r.bottom];

      document.getElementById('ceiling').setAttribute('points', pts([[0,0],[w,0],tr,tl]));
      document.getElementById('floor').setAttribute('points',   pts([bl,br,[w,h],[0,h]]));
      document.getElementById('left').setAttribute('points',    pts([[0,0],tl,bl,[0,h]]));
      document.getElementById('right').setAttribute('points',   pts([tr,[w,0],[w,h],br]));
    }

    window.addEventListener('resize', drawRoom);
    drawRoom();
  </script>
</body>
</html>
