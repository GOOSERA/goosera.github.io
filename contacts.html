<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #318c88;
      --green: #4aa06d;
      --mustard: #d4a637;
      --white: #f4f7f5;
      --line: 3px;
      --icon: clamp(48px, 8vw, 96px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      min-height: 100vh;
      background: linear-gradient(50deg,
        var(--teal) 0%, var(--teal) 58%,
        var(--green) 58.2%, var(--green) 78%,
        var(--mustard) 78.2%, var(--mustard) 100%);
      background-attachment: fixed;
      font-family: "Gochi Hand", "Comic Sans MS", "Segoe Print", cursive;
      color: var(--white);
      padding: 2vh 0 4vh;
    }

    /* Top line with the back link above it */
    header {
      margin-left: 4vw;
      padding-bottom: 0.4em;
      border-bottom: var(--line) solid var(--white);
    }
    header a {
      color: var(--white);
      text-decoration: none;
      font-size: 1.2rem;
    }
    header a:hover { text-decoration: underline; }

    /* The big frame */
    main {
      margin: 3vh 0 0 2vw;
      border: var(--line) solid var(--white);
      border-right: 0;
      padding: 4vh 4vw;
      min-height: 75vh;
    }

    .grid {
      position: relative;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--icon), 1fr));
      gap: 5vh 4vw;
      align-items: start;
    }

    .contact {
      display: flex;
      align-items: flex-start;
      min-width: 0;
    }

    /* The icon box */
    .contact button {
      flex-shrink: 0;
      width: var(--icon);
      aspect-ratio: 1 / 1;
      background: transparent;
      border: var(--line) solid var(--white);
      color: var(--white);
      font: inherit;
      font-size: clamp(0.9rem, 1.6vw, 1.4rem);
      cursor: pointer;
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .contact button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .contact button:hover { background: rgba(255, 255, 255, 0.08); }
    .contact button:focus-visible { outline: 2px dashed var(--white); outline-offset: 4px; }

    /* Icons covered by the open panel hide until it closes */
    .contact button { transition: opacity 0.2s ease, visibility 0.2s ease; }
    .contact.covered button { opacity: 0; visibility: hidden; }

    /* The line + username that slides out (one shared panel) */
    .details {
      position: absolute;
      z-index: 2;
      display: none;
      border-top: var(--line) solid var(--white);
      padding: 0.4em 0.6em 0;
      font-size: clamp(1.2rem, 2.4vw, 2.2rem);
      overflow-wrap: anywhere;
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.35s ease;
    }
    .details.show { display: block; }
    .details.left { text-align: right; clip-path: inset(0 0 0 100%); }
    .details.show.revealed { clip-path: inset(0 0 0 0); }
    .details a { color: var(--white); }
    .details .site {
      display: block;
      font-size: 0.6em;
      opacity: 0.85;
    }

    @media (prefers-reduced-motion: reduce) {
      .details { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html">Back</a>
  </header>

  <main>
    <!--
      Each contact looks like this:

        <div class="contact" data-site="YouTube" data-username="@TheOnion" data-link="https://youtube.com/@TheOnion">
          <button>Icon</button>
        </div>

      • data-site      what the platform is (shown small under the username)
      • data-username  the text that appears under the line
      • data-link      optional; makes the username clickable
      • To use a picture, put an <img> inside the button:
          <button><img src="icons/youtube.png" alt=""></button>
    -->
    <div class="grid">
      <div class="contact" data-site="YouTube" data-username="Username" data-link=""><button>Icon</button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>

      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>

      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>

      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
      <div class="contact" data-site="Site" data-username="Username" data-link=""><button></button></div>
    </div>
  </main>

  <script>
    const grid = document.querySelector('.grid');
    const contacts = [...document.querySelectorAll('.contact')];

    // One shared panel for the line + username
    const panel = document.createElement('div');
    panel.className = 'details';
    panel.id = 'contact-details';
    panel.setAttribute('role', 'region');
    grid.appendChild(panel);

    let openContact = null;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const SLIDE_MS = 350;   // matches the .details transition
    let closeTimer = null;

    function resetDelays() {
      contacts.forEach(c => c.querySelector('button').style.transitionDelay = '');
    }

    // Instant close (used when switching to another icon)
    function closePanel() {
      clearTimeout(closeTimer);
      if (openContact) openContact.querySelector('button').setAttribute('aria-expanded', 'false');
      openContact = null;
      panel.classList.remove('show', 'revealed', 'left');
      resetDelays();
      contacts.forEach(c => c.classList.remove('covered'));
    }

    // Smooth close (used when clicking the open icon again):
    // the line pulls back into its icon, and covered icons fade back in
    // as the line passes them, farthest first.
    function retractPanel() {
      if (reduceMotion.matches) { closePanel(); return; }

      const contact = openContact;
      contact.querySelector('button').setAttribute('aria-expanded', 'false');
      openContact = null;

      const p = panel.getBoundingClientRect();
      const goLeft = panel.classList.contains('left');
      contacts.forEach(c => {
        if (!c.classList.contains('covered')) return;
        const r = c.querySelector('button').getBoundingClientRect();
        // how far along the line (from its far end) this icon sits, 0..1
        const fromFarEnd = goLeft
          ? (r.left - p.left) / p.width
          : (p.right - r.right) / p.width;
        const delay = Math.max(0, Math.min(1, fromFarEnd)) * SLIDE_MS;
        c.querySelector('button').style.transitionDelay = delay + 'ms';
        c.classList.remove('covered');
      });

      panel.classList.remove('revealed');
      closeTimer = setTimeout(() => {
        panel.classList.remove('show', 'left');
        resetDelays();
      }, SLIDE_MS);
    }

    function placePanel(contact, animate) {
      const button = contact.querySelector('button');
      const g = grid.getBoundingClientRect();
      const b = button.getBoundingClientRect();
      const spaceRight = g.right - b.right;
      const spaceLeft = b.left - g.left;
      const goLeft = spaceLeft > spaceRight;

      panel.classList.toggle('left', goLeft);
      panel.style.top = (b.top - g.top) + 'px';
      panel.style.left = (goLeft ? 0 : b.right - g.left) + 'px';
      panel.style.width = (goLeft ? spaceLeft : spaceRight) + 'px';
      panel.style.minHeight = b.height + 'px';
      panel.classList.add('show');
      if (!animate) panel.classList.add('revealed');

      // Hide any icons sitting under the panel
      const p = panel.getBoundingClientRect();
      contacts.forEach(c => {
        if (c === contact) { c.classList.remove('covered'); return; }
        const r = c.querySelector('button').getBoundingClientRect();
        const overlaps = r.right > p.left && r.left < p.right && r.bottom > p.top && r.top < p.bottom;
        c.classList.toggle('covered', overlaps);
      });

      if (animate) {
        panel.classList.remove('revealed');
        requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.add('revealed')));
      }
    }

    contacts.forEach(contact => {
      const button = contact.querySelector('button');
      const { site = '' } = contact.dataset;
      button.setAttribute('aria-expanded', 'false');
      button.setAttribute('aria-controls', panel.id);
      if (!button.getAttribute('aria-label')) button.setAttribute('aria-label', site || 'Contact');

      button.addEventListener('click', () => {
        if (openContact === contact) { retractPanel(); return; }
        closePanel();

        const { username = '', link = '' } = contact.dataset;
        const name = link
          ? `<a href="${link}" target="_blank" rel="noopener">${username}</a>`
          : username;
        panel.innerHTML = `${name}${site ? `<span class="site">${site}</span>` : ''}`;

        openContact = contact;
        button.setAttribute('aria-expanded', 'true');
        placePanel(contact, true);
      });
    });

    // Keep the panel lined up if the window changes size
    window.addEventListener('resize', () => {
      if (openContact) placePanel(openContact, false);
    });

    // Escape closes it
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && openContact) {
        const btn = openContact.querySelector('button');
        retractPanel();
        btn.focus();
      }
    });
  </script>
</body>
</html>
